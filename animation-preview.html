<!doctype html><html lang="hu"><meta charset="utf-8"><title>CHERRIFT – közös animációsimítás</title>
<style>body{margin:0;background:#2c2233;color:#ffe9f4;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}select,button{font:inherit;padding:9px;background:#493448;color:inherit;border:1px solid #97708b;border-radius:8px;margin:6px}canvas{background:#423447;max-width:100%;height:auto}p{font-size:14px;color:#dcbfd0}</style>
<main><h1>Közös animációsimítás</h1><select id="skin"><option value="wuxia_sakura_cherry">Sakura Dance</option><option value="cherry_default">Base</option><option value="archer_cherry">Archer</option><option value="ninja_cherry">Ninja / Shadow Sakura</option><option value="succubus_cherry">Succubus</option></select><select id="dir"><option>down</option><option>left</option><option>up_left</option><option>up</option><option>right</option><option>down_right</option><option>up_right</option><option>down_left</option></select><select id="idleVariant"><option value="idle">Alap idle</option><option value="idle2">Idle 2</option><option value="idle3">Idle 3</option></select><label><input id="walkAttack" type="checkbox">Járó támadás</label><button id="pause">Szünet</button><canvas id="view" width="1280" height="480"></canvas><p id="status">Betöltés…</p><p>Azonos rajzokból számolt köztes pózok. Járásnál a teljes eredeti póz együtt mozog: nincs külön felsőtest–láb vágás. A harci események időzítése változatlan.</p></main>
<script>window.CherriftGame=class{movePlayer(){}};</script><script src="src/cherrift_cherry_geometry.js"></script><script src="src/cherrift_cherry_shot_alignment.js"></script><script src="src/cherrift_cherry_gait.js"></script><script src="src/cherrift_cherry_motion.js"></script>
<script src="src/cherrift_animation_flow.js"></script><script src="src/cherrift_animation_smoothing.js"></script>
<script src="src/cherrift_sakura_dance_gait.js"></script><script src="src/cherrift_succubus_gait.js"></script>
<script>
const $=id=>document.getElementById(id),ctx=$('view').getContext('2d');let clock=0,last=0,paused=false,token=0,art={},neutral=null,ready=false;
const roots={wuxia_sakura_cherry:['sakura_dance_cherry','.'],cherry_default:['base_cherry','.'],archer_cherry:['archer_cherry','.'],ninja_cherry:['ninja_cherry','.'],succubus_cherry:['succubus_cherry','.']};
async function image(url){const im=new Image();im.src=url;await im.decode();return im;}
async function load(){const at=++token;ready=false;const id=$('skin').value,dir=$('dir').value,[folder,base]=roots[id];let idleState=$('idleVariant').value;if(id!=='wuxia_sakura_cherry'&&id!=='succubus_cherry'&&idleState==='idle3')idleState='idle2';let attack=id==='succubus_cherry'?'attack_ranged':id==='ninja_cherry'?'attack_melee':'attack';if($('walkAttack').checked)attack='walk_'+attack;const states=[idleState,'walk',attack,'skill'];
 const loaded={};for(const state of states)loaded[state]=await image(`${base}/assets/player/cherry_skins/${folder}/sheets192/${folder}_${state}_${dir}.png`);
 const baseIdle=await image(`${base}/assets/player/cherry_skins/${folder}/sheets192/${folder}_idle_${dir}.png`);if(at===token){art=loaded;neutral=baseIdle;ready=true;clock=0;}}
function makeFrame(im,dir,id,state){return (c,f)=>{if(['cherry_default','archer_cherry','ninja_cherry'].includes(id))CHERRIFT_CHERRY_MOTION.renderPose(c,im,id,state,dir,f,{x:96,y:154,__smoothSkipGait:true},192,192);else c.drawImage(im,f*192,0,192,192,0,0,192,192);};}
function tick(now){if(!paused)clock+=last?Math.min(.05,(now-last)/1000):0;last=now;ctx.clearRect(0,0,1280,480);if(ready){const id=$('skin').value,dir=$('dir').value;
 let col=0;for(const [state,im] of Object.entries(art)){const fps=state.startsWith('idle')?3:state==='walk'?8:state==='skill'?16:18,count=Array.isArray(im)?im.length:Math.floor(im.width/192),phase=clock*fps%count,frame=Math.floor(phase),x=col*320+160,y=400,scale=id==='wuxia_sakura_cherry'?2.1:1.575;
 const make=makeFrame(im,dir,id,state);
 ctx.fillStyle='#f9ddec';ctx.font='18px system-ui';ctx.fillText(state,col*320+15,28);ctx.strokeStyle='#c798b655';ctx.beginPath();ctx.moveTo(col*320+8,y);ctx.lineTo(col*320+308,y);ctx.stroke();
 const ok=CHERRIFT_ANIMATION_SMOOTHING.draw(ctx,Array.isArray(im)?im[0]:im,id,state,dir,phase,{x,y:y-30},192*scale,192*scale,{makeFrame:make,loop:true});if(!ok){const tmp=document.createElement('canvas');tmp.width=tmp.height=192;make(tmp.getContext('2d'),frame);ctx.drawImage(tmp,x-96*scale,y-184*scale,192*scale,192*scale);}col++;}
 $('status').textContent=JSON.stringify(CHERRIFT_ANIMATION_SMOOTHING.stats());}
 requestAnimationFrame(tick);} $('skin').onchange=load;$('dir').onchange=load;$('idleVariant').onchange=load;$('walkAttack').onchange=load;$('pause').onclick=()=>paused=!paused;const selected=new URLSearchParams(location.search).get('skin');if(selected&&roots[selected])$('skin').value=selected;load();requestAnimationFrame(tick);
</script></html>
