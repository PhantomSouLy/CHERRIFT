name: CHERRIFT validation

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      protected: ${{ steps.select.outputs.protected }}
    steps:
      - name: Check out impact policy without image history
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            package.json
            src/cherrift_manifest.json
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select conservative test plan
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci_plan.mjs

  validate:
    name: Validate source
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Job-level grouping lets the inspected version change protect release runs.
    # Unique protected groups also prevent pending release/manual runs being evicted.
    concurrency:
      group: cherrift-ci-source-${{ github.event_name }}-${{ needs.changes.outputs.protected == 'true' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.changes.outputs.protected != 'true' }}
    steps:
      - name: Require successful change detection
        env:
          DETECTION: ${{ needs.changes.result }}
        run: test "$DETECTION" = success
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up audit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt
      - name: Install audit parser
        run: python -m pip install -r tools/requirements-audit.txt
      - name: Validate source, references, manifests and image integrity
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          npm run validate
          npm run audit
          node tools/ci_assets.mjs
          npm run test:ci
      - name: Run selected regression suites
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: node tools/ci_run.mjs

  smoke:
    # Keep all ten legacy check names, including when a case is intentionally omitted.
    name: Smoke · ${{ matrix.case }}
    needs: [changes, validate]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: cherrift-ci-smoke-${{ matrix.case }}-${{ github.event_name }}-${{ needs.changes.outputs.protected == 'true' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.changes.outputs.protected != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        case:
          - desktop
          - wide-desktop
          - short-desktop
          - phone-portrait
          - phone-landscape
          - returning-session
          - gm-returning-session
          - gm-phone
          - auth-timeout
          - cloud-timeout
    steps:
      - name: Require successful validation
        env:
          DETECTION: ${{ needs.changes.result }}
          VALIDATION: ${{ needs.validate.result }}
        run: test "$DETECTION" = success && test "$VALIDATION" = success
      - name: Check out repository
        if: ${{ contains(fromJSON(needs.changes.outputs.plan).smoke, matrix.case) }}
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ contains(fromJSON(needs.changes.outputs.plan).smoke, matrix.case) }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: ${{ contains(fromJSON(needs.changes.outputs.plan).smoke, matrix.case) }}
        run: npm ci --no-audit --no-fund
      - name: Run smoke case
        if: ${{ contains(fromJSON(needs.changes.outputs.plan).smoke, matrix.case) }}
        env:
          CHERRIFT_SMOKE_TIMEOUT_MS: 120000
          SMOKE_CASE: ${{ matrix.case }}
        run: npm run smoke -- --case="$SMOKE_CASE"
      - name: Record selection
        env:
          SELECTED: ${{ contains(fromJSON(needs.changes.outputs.plan).smoke, matrix.case) }}
          SMOKE_CASE: ${{ matrix.case }}
        run: echo "Smoke · $SMOKE_CASE — selected=$SELECTED" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: CI summary
    needs: [changes, validate, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Summarize and enforce results
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const results = JSON.parse(process.env.RESULTS);
          const plan = JSON.parse(process.env.PLAN || 'null');
          const rows = Object.entries(results).map(([name, value]) => `| ${name} | ${value.result} |`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## CHERRIFT CI\n\n${plan ? `${plan.full ? 'Full' : 'Targeted'} · ${plan.changedCount} changed paths · ${plan.smoke.length}/10 Smoke cases\n\n${plan.reasons.join('; ')}\n\n` : 'No valid selection plan.\n\n'}| Stage | Result |\n|---|---|\n${rows.join('\n')}\n`);
          if (!plan || Object.values(results).some(value => value.result !== 'success')) process.exit(1);
          JS
