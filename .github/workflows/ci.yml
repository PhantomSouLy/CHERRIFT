name: CHERRIFT validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up audit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit parser
        run: python -m pip install -r tools/requirements-audit.txt

      - name: Validate every tracked file
        run: |
          npm run validate
          npm run audit
          npm run test:integrity
          npm run test:online-api
          npm run test:gunner
          npm run smoke:supabase-lock

  smoke:
    name: Smoke · ${{ matrix.case }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 4

    strategy:
      fail-fast: false
      matrix:
        case:
          - desktop
          - wide-desktop
          - short-desktop
          - phone-portrait
          - phone-landscape
          - returning-session
          - gm-returning-session
          - auth-timeout
          - cloud-timeout

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke case
        env:
          CHERRIFT_SMOKE_TIMEOUT_MS: 120000
        run: npm run smoke -- --case=${{ matrix.case }}
