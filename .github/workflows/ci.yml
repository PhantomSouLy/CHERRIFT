name: CHERRIFT validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

  smoke:
    name: Smoke · ${{ matrix.case }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 4

    strategy:
      fail-fast: false
      matrix:
        case:
          - desktop
          - short-desktop
          - phone-portrait
          - phone-landscape
          - returning-session

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke case
        env:
          CHERRIFT_SMOKE_TIMEOUT_MS: 120000
        run: npm run smoke -- --case=${{ matrix.case }}
